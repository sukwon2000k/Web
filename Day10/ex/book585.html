    <script>
        function sumMulti(x, y){
            var x=parseInt( prompt('첫번째 수를 입력하세요.'))
            var y=parseInt( prompt('두번째 수를 입력하세요.'))
            if(x===y){
                var multiple=x * y
                console.log(multiple)
            }else{
                var sum= x + y
                console.log(sum)
            }
        }
        sumMulti();
    </script>
