<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
body{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    background:#f4f6f9;
    font-family:'맑은 고딕', sans-serif;
    margin:0;
    padding:40px;
}

h1{
    color:#333;
    margin-bottom:30px;
}

div{
    width:700px;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,0.15);
}

ul{
    list-style:none;
    padding:0;
    margin:0 0 20px 0;

    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

ul li{
    background:#4a90e2;
    color:white;
    padding:8px 15px;
    border-radius:20px;
    font-weight:bold;
}

span{
    display:block;
    text-align:center;
    font-size:22px;
    font-weight:bold;
    color:#e74c3c;
    margin-top:10px;
}
    </style>
</head>
<body>
    <h1>3의 배수 찾기</h1>
    <div>
    <ul>
        <script>
            var c=0;
            n=parseInt(prompt('몇 까지 3의 배수를 찾을까요?'));
            if(n==''|| n==null){
                document.write('결과를 보여주지 않습니다.')
            }else{
                for( let m=1; m<n; m++){
                    if(m%3==0){
                        c++
                        document.write(`<li>${m}</li>`)
                    }
                }
            }
        </script>
        </ul>
    <script>
            document.write(`<span>${n}까지 3의 배수의 개수: ${c}</span>`)
    </script>
    </ul>
    </div>
</body>
</html>
