<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    display: flex;
    justify-content: center;
    background: #f5f5f5;
}

#king{
    width: 400px;
    min-height: 100vh;
    padding: 20px;
    background: white;
}

header{
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 50px;
}

#header-img{
    width: 25px;
}

#aaa{
    color: #bbb;
    font-size: 20px;
    font-weight: bold;
}

#main-text{
    font-size: 40px;
    margin-bottom: 20px;
}

#main-foot{
    color: #aaa;
    font-size: 22px;
    margin-bottom: 40px;
}

.card-container{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.card{
    text-align: center;
}

.card img{
    width: 100%;
    height: 110px;
    padding: 20px;
    background: #f4f4ff;
    border-radius: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
}

.card h3{
    margin-top: 10px;
    font-size: 18px;
}

footer{
    margin-top: 50px;
}

#footer-button{
    width: 100%;
    height: 60px;
    border: none;
    border-radius: 15px;
    background: #6d28d9;
    color: white;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
}
    </style>
</head>
<body>
    <div id="king">

    <header>
        <img id="header-img" src="./image/arrow.png" alt="">
        <h3 id="aaa">4/10</h3>
    </header>

    <main>

        <h2 id="main-text">
            고민되시거나 개선하고 싶은<br>
            건강고민을 선택해주세요
        </h2>

        <p id="main-foot">최대 8개 선택</p>

        <div class="card-container">

            <div class="card">
                <img src="./image/view.png">
                <h3>눈 건강</h3>
            </div>

            <div class="card">
                <img src="./image/blood-drop.png">
                <h3>피로감</h3>
            </div>

            <div class="card">
                <img src="./image/diamond-ring.png">
                <h3>장 건강</h3>
            </div>

            <div class="card">
                <img src="./image/view.png">
                <h3>피부 건강</h3>
            </div>

            <div class="card">
                <img src="./image/blood-drop.png">
                <h3>빈혈</h3>
            </div>

            <div class="card">
                <img src="./image/diamond-ring.png">
                <h3>노화 & 항산화</h3>
            </div>

        </div>

    </main>

    <footer>
        <button id="footer-button">확인</button>
    </footer>

</div>
네 코드에서 특히 고쳐야 하는 부분
</body>
</html>
